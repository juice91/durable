[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-iam-openaccess"
version = "0.5.0"
description = "IAM policy plug-in (transitional): every authenticated user is admin"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-iam",
]

[project.entry-points."eap.iam.policy"]
openaccess = "eap_iam_openaccess:create"

[tool.uv.sources]
eap-iam = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eap_iam_openaccess"]
