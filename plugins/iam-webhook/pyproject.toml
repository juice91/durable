[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-iam-webhook"
version = "0.5.0"
description = "IAM identity plug-in: an inbound webhook delivery, authenticated by its HMAC signature, is a machine principal with a fixed grant"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-iam",
    "eap-inbound",
    "eap-run-store",
    "eap-schemas",
    "eap-secrets",
]

[project.entry-points."eap.iam.identity"]
webhook = "eap_iam_webhook:create"

[tool.uv.sources]
eap-iam = { workspace = true }
eap-inbound = { workspace = true }
eap-run-store = { workspace = true }
eap-schemas = { workspace = true }
eap-secrets = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eap_iam_webhook"]
