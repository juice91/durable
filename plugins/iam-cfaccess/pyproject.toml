[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-iam-cfaccess"
version = "0.5.0"
description = "IAM identity plug-in: the Cloudflare Access JWT (Cf-Access-Jwt-Assertion), e-mail as the user subject"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-iam",
    "pyjwt[crypto]>=2.8",
]

[project.entry-points."eap.iam.identity"]
cfaccess = "eap_iam_cfaccess:create"

[tool.uv.sources]
eap-iam = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eap_iam_cfaccess"]
