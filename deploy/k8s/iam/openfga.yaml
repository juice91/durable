# OpenFGA (authorization): one replica, datastore = the platform's Postgres (database openfga, role openfga),
# preshared-key authentication, playground off, metrics on. ClusterIP only: it is never published.
# Off by default (replicas: 0); up.sh scales it to 1 only when the deploy Secret carries OPENFGA_DB_PASSWORD and
# OPENFGA_PRESHARED_KEY. `optional: true` only keeps the pod spec valid when a key is absent from the Secret.
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 8081, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: openfga}
  template:
    metadata:
      labels: {app.kubernetes.io/name: openfga}
      # up.sh replaces the placeholder with a hash of the Secret values this pod reads, so a rotated value restarts it
      # at the next deploy, under the drain. Placeholder text is harmless without up.sh.
      annotations: {pydanticos.dev/secrets-checksum: "@@CHECKSUM_OPENFGA@@"}
    spec:
      # Service-link env vars (OPENFGA_PORT=tcp://ip:PORT) would be read by the app as configuration and crash it.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Idempotent: applies the schema migrations the pinned version needs, then exits.
        - name: migrate
          # Pinned by version and digest (multi-arch index, includes linux/arm64). Bump both together.
          image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: OPENFGA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: openfga-secrets, key: OPENFGA_DB_PASSWORD, optional: true}
            - {name: OPENFGA_DATASTORE_ENGINE, value: postgres}
            # $(OPENFGA_DB_PASSWORD) is expanded by Kubernetes; up.sh only accepts URL-safe characters in it.
            - {name: OPENFGA_DATASTORE_URI, value: "postgres://openfga:$(OPENFGA_DB_PASSWORD)@postgres.pydanticos.svc.cluster.local:5432/openfga?sslmode=disable"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {cpu: "500m", memory: 256Mi}
      containers:
        - name: openfga
          image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            - name: OPENFGA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: openfga-secrets, key: OPENFGA_DB_PASSWORD, optional: true}
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef: {name: openfga-secrets, key: OPENFGA_PRESHARED_KEY, optional: true}
            - {name: OPENFGA_DATASTORE_ENGINE, value: postgres}
            - {name: OPENFGA_DATASTORE_URI, value: "postgres://openfga:$(OPENFGA_DB_PASSWORD)@postgres.pydanticos.svc.cluster.local:5432/openfga?sslmode=disable"}
            - {name: OPENFGA_AUTHN_METHOD, value: preshared}
            - {name: OPENFGA_PLAYGROUND_ENABLED, value: "false"}
            - {name: OPENFGA_METRICS_ENABLED, value: "true"}
            - {name: OPENFGA_METRICS_ADDR, value: "0.0.0.0:2112"}
            - {name: OPENFGA_LOG_FORMAT, value: json}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8081}
            - {name: metrics, containerPort: 2112}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
