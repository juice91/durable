# Namespace iam: default-deny, then only the flows below. Pods in pydanticos are matched with a namespaceSelector on the
# automatic kubernetes.io/metadata.name label; the matching egress and Postgres-ingress rules for the other direction
# are in ../networkpolicy.yaml (iam-egress-*, postgres-ingress-iam). Nothing else reaches zitadel or openfga.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam-egress-postgres
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [zitadel, openfga]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pydanticos
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - {protocol: TCP, port: 5432}
---
# Token verification by the API and the worker. Public sign-in goes through your ingress controller, which needs its own
# rule (docs/expose.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pydanticos
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, worker]
      ports:
        - {protocol: TCP, port: 8080}
---
# Authorization checks: the API and the worker only (HTTP 8080 and gRPC 8081). Not an ingress, not Studio.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openfga-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pydanticos
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [api, worker]
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
