# Template only; deliberately excluded from kustomization.yaml. up.sh creates these two Secrets, one per component, from
# the deploy secrets (only the fields that are present).
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-secrets
  namespace: iam
type: Opaque
stringData:
  ZITADEL_MASTERKEY: ""
  ZITADEL_DB_PASSWORD: ""
  ZITADEL_ADMIN_USERNAME: ""
  ZITADEL_ADMIN_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: openfga-secrets
  namespace: iam
type: Opaque
stringData:
  OPENFGA_DB_PASSWORD: ""
  OPENFGA_PRESHARED_KEY: ""
