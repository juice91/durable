apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          # The dump runs in the CronJob itself, so backups happen even when the platform is down.
          containers:
            - name: pg-dump
              image: pgvector/pgvector:0.8.2-pg17-trixie
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
              command: ["sh", "-eu", "/scripts/backup.sh"]
              env:
                - name: EAP_APP_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: pydanticos-secrets, key: EAP_APP_DATABASE_PASSWORD}
                - name: EAP_DBOS_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: pydanticos-secrets, key: EAP_DBOS_DATABASE_PASSWORD}
                # Optional (identity services, deploy/k8s/iam): dumped only when present.
                - name: ZITADEL_DB_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: pydanticos-secrets, key: ZITADEL_DB_PASSWORD, optional: true}
                - name: OPENFGA_DB_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: pydanticos-secrets, key: OPENFGA_DB_PASSWORD, optional: true}
                # Dumps older than this many days are deleted after each backup.
                - name: BACKUP_RETENTION_DAYS
                  value: "7"
              resources:
                requests: {cpu: "100m", memory: 128Mi}
                limits: {cpu: "1", memory: 1Gi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
                - {name: script, mountPath: /scripts, readOnly: true}
          volumes:
            - name: backups
              hostPath:
                # Placeholder. up.sh rewrites this to ${PYDANTICOS_DATA_DIR}/backups.
                path: /var/lib/pydanticos-backup-dir
                type: Directory
            - name: tmp
              emptyDir: {}
            - name: script
              configMap:
                name: postgres-backup-script
                defaultMode: 0555
