apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
      # up.sh replaces the placeholder with a hash of the Secret values this pod reads, so a rotated value restarts it
      # at the next deploy, under the drain (deploy/README.md, "Rotation"). Placeholder text is harmless without up.sh.
      annotations: {pydanticos.dev/secrets-checksum: "@@CHECKSUM_PLATFORM@@"}
    spec:
      serviceAccountName: pydanticos-mcp-api
      hostAliases:
        - ip: 192.168.5.2
          hostnames: [host.lima.internal]
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: pydanticos-python
          imagePullPolicy: Never
          args: [api]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: pydanticos-config}
          env:
            - name: EAP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DATABASE_URL}
            - name: EAP_DBOS_URL
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DBOS_URL}
            - name: EAP_SECRETS_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_SECRETS_KEY}
            - name: EAP_AUDIT_HASH_SALT
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_AUDIT_HASH_SALT}
            - name: EAP_BLOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_ACCESS_KEY}
            - name: EAP_BLOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_SECRET_KEY}
            # Model discovery (GET /models, provider status, the Architect seed) asks the LiteLLM gateway
            # for its model list and capabilities; without the key the provider reads "not configured".
            - name: EAP_LITELLM_API_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_LITELLM_API_KEY}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: ANTHROPIC_API_KEY, optional: true}
            # Cloudflare Workers AI (optional): the provider stays off while the key is absent from the Secret.
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: CLOUDFLARE_API_TOKEN, optional: true}
            # ZITADEL sign-in and members (optional, from the IAM bootstrap): while the project id and the org map are
            # absent the zitadel plug-in is dormant; without the machine key the Members page is not offered.
            - name: EAP_ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_ZITADEL_PROJECT_ID, optional: true}
            - name: EAP_ZITADEL_ORG_TENANT_MAP
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_ZITADEL_ORG_TENANT_MAP, optional: true}
            - name: EAP_ZITADEL_MACHINE_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_ZITADEL_MACHINE_KEY, optional: true}
          resources:
            requests: {cpu: "250m", memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
