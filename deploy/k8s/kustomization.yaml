apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pydanticos
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - postgres.yaml
  - backup.yaml
  - lgtm.yaml
  - rbac-mcp.yaml
  - migrate.yaml
  - worker.yaml
  - api.yaml
  - studio.yaml
  - cloudflared.yaml
images:
  - name: pydanticos-python
    newName: pydanticos-python
    newTag: dev
  - name: pydanticos-studio
    newName: pydanticos-studio
    newTag: dev
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: postgres-backup-script
    files:
      - backup.sh=backup-job.sh
