apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  suspend: true
  # Connectivity is retried before Alembic starts. Never rerun a real migration failure.
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: pydanticos-python
          imagePullPolicy: Never
          args: [migrate]
          envFrom:
            - configMapRef: {name: pydanticos-config}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - name: EAP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DATABASE_URL}
            - name: EAP_BLOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_ACCESS_KEY}
            - name: EAP_BLOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_SECRET_KEY}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
