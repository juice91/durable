apiVersion: v1
kind: ConfigMap
metadata:
  name: pydanticos-config
data:
  EAP_AUTH_MODE: dev
  # Inbound webhooks (docs/webhooks.md): off, so every hook URL answers 404. Enable them once the hooks path is reachable
  # through your Ingress or reverse proxy (docs/expose.md).
  EAP_WEBHOOKS_ENABLED: "false"
  # External agents (docs/external-access.md): off, so /api/v1/external/ answers 404. Switching it on needs
  # EAP_AUTH_MODE=production.
  EAP_EXTERNAL_ACCESS_ENABLED: "false"
  # Peers whose CF-Connecting-IP header is believed as the sender's address (the per-address rate limits). Empty trusts
  # nobody. Set it only to the CIDR of a proxy that overwrites that header on every request (docs/expose.md).
  EAP_TRUSTED_PROXY_CIDRS: ""
  # IAM plug-ins (docs/iam.md): identity providers in order (first match wins) and
  # exactly one policy engine. `zitadel` = ZITADEL access tokens (Studio's own OIDC sign-in), verified first; a
  # JWT-shaped bearer that fails is a 401 that never falls through. `apikey` = tenant API keys and the Architect run
  # token; `devloopback` = the dev bearer, accepted only from a loopback TCP peer (kubectl port-forward, the SSH tunnel);
  # `openaccess` = every user is admin. The `zitadel` plug-in is DORMANT until you have run its bootstrap
  # (plugins/iam-zitadel/README.md) and stored EAP_ZITADEL_PROJECT_ID and EAP_ZITADEL_ORG_TENANT_MAP in the deploy secrets:
  # nobody can sign in through ZITADEL without them. The membership source (the Members page) additionally needs
  # EAP_ZITADEL_MACHINE_KEY and is left out of the capabilities answer while that is missing.
  #
  # The default sign-in is `localadmin`: ONE built-in admin account (docs/admin-account.md). up.sh generates its signing
  # key into the cluster's Secret and ends with the link that creates the account (or set EAP_LOCAL_ADMIN_USERNAME and
  # EAP_LOCAL_ADMIN_INITIAL_PASSWORD in the deploy secrets for an automated install). For several users
  # or roles switch to ZITADEL: EAP_IAM_IDENTITY "zitadel,apikey,devloopback", EAP_IAM_MEMBERSHIP zitadel and
  # EAP_STUDIO_AUTH zitadel (docs/admin-account.md, "Switching to ZITADEL").
  EAP_IAM_IDENTITY: "localadmin,apikey,devloopback"
  # For trial use: every signed-in user is admin. For per-user authorization follow docs/iam.md, "Switching to OpenFGA".
  EAP_IAM_POLICY: openaccess
  EAP_IAM_MEMBERSHIP: localadmin
  # OpenFGA (authorization, namespace iam): read by the API and the worker only when EAP_IAM_POLICY is `openfga`.
  # The two ids are printed by the bootstrap and are not secrets; the preshared key
  # comes from the Secret (OPENFGA_PRESHARED_KEY, the field OpenFGA itself reads). Switching is docs/iam.md, "Switching to
  # OpenFGA". An empty store id with `openfga` selected refuses to start. The list limit must equal the server's
  # OPENFGA_LIST_OBJECTS_MAX_RESULTS and the batch size must not exceed its OPENFGA_MAX_CHECKS_PER_BATCH_CHECK (both defaults).
  EAP_OPENFGA_URL: http://openfga.iam.svc.cluster.local:8080
  # Empty until you bootstrap your own OpenFGA (docs/iam.md, "Switching to OpenFGA"); set both before selecting `openfga`.
  EAP_OPENFGA_STORE_ID: ""
  EAP_OPENFGA_MODEL_ID: ""
  EAP_OPENFGA_TIMEOUT_SECONDS: "3"
  EAP_OPENFGA_LIST_LIMIT: "1000"
  EAP_OPENFGA_BATCH_SIZE: "50"
  # Agent-bound grants (docs/iam.md, "Agent and workflow grants"): the worker's run-time gates. "1" only after the switch
  # to `openfga` and the grants backfill.
  EAP_AGENT_GRANTS_ENFORCE: "0"
  # ZITADEL: the public issuer (the exact `iss`), and the in-cluster Service the API verifies tokens and calls the
  # management API through (the Host header stays the issuer's host; the iam-egress-zitadel policy allows it).
  EAP_ZITADEL_ISSUER: https://auth.example-org.ai
  EAP_ZITADEL_API_URL: http://zitadel.iam.svc.cluster.local:8080
  # How Studio signs people in (docs/admin-account.md, "The three Studio sign-in modes"): `local` (the built-in admin
  # account), `zitadel` (OIDC code + PKCE against ZITADEL, once EAP_ZITADEL_STUDIO_CLIENT_ID and
  # EAP_ZITADEL_PROJECT_ID are in the deploy secrets) or `access` (an identity-aware proxy in front, with its identity plug-in). The loopback page of a
  # port-forward keeps the dev bearer either way. A mode that cannot work shows "No sign-in method is configured".
  EAP_STUDIO_AUTH: local
  # audit_log keeps 400 days (eap_worker.audit_retention prunes older rows daily); `off` keeps everything.
  EAP_AUDIT_RETENTION_DAYS: "400"
  # Studio over the SSH tunnel (http://127.0.0.1:13000) calls the API's own port-forward (http://127.0.0.1:18000)
  # directly: a loopback peer. These are the only origins that get CORS for it (loopback hosts only; no credentials).
  EAP_CORS_LOOPBACK_ORIGINS: http://127.0.0.1:13000,http://localhost:13000
  EAP_AGUI_CORS_ORIGINS: http://localhost:13000,http://127.0.0.1:13000
  EAP_APP_VERSION: m1
  EAP_DBOS_SYSTEM_SCHEMA: dbos
  EAP_LITELLM_BASE_URL: http://host.lima.internal:4001
  EAP_LITELLM_EMBEDDING_BASE_URL: http://host.lima.internal:4001
  EAP_ALLOWED_MODELS: "litellm:*,anthropic:*"
  EAP_ALLOWED_EMBEDDING_MODELS: "litellm:Qwen3-VL-Embedding-8B-mlx-8bit=1024"
  EAP_ALLOWED_TOOLS: "clock.now,clock.sleep,secrets.request,http.request,workflow.return,workflow.history,feed.parse,json.query,text.check,html.extract,atproto.richtext,tickets.create,kb.source.get,settings.connection.check,kb.source.sync,workflow.run.wait,workflow.run.result"
  EAP_LOKI_URL: http://lgtm:3100
  # The worker reaches the API's MCP control endpoint as the Architect's run (the `control__*` tools); the bearer is a
  # two-minute run token signed with a key derived from EAP_SECRETS_KEY, so nothing else is configured.
  EAP_API_INTERNAL_URL: http://api:8000
  # Chat attachment bytes live in S3-compatible object storage, reached over HTTPS 443: any such store works, for example
  # MinIO or AWS S3. Replace the endpoint with yours; the access key and secret come from the Secret (EAP_BLOB_S3_ACCESS_KEY,
  # EAP_BLOB_S3_SECRET_KEY). You create the bucket. EAP_BLOB_S3_PATH_STYLE: "false" selects virtual-hosted addressing.
  EAP_BLOB_BACKEND: s3
  EAP_BLOB_S3_ENDPOINT: https://YOUR_S3_ENDPOINT
  EAP_BLOB_S3_BUCKET: pydanticos-attachments
  EAP_BLOB_S3_REGION: us-east-1
  # up.sh replaces these with the cluster's `kubernetes` Service and endpoint addresses.
  EAP_MCP_API_SERVER_CIDRS: 10.43.0.1/32,192.168.5.3/32
  EAP_MCP_API_SERVER_PORTS: 443,6443
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  # External OpenTelemetry traces (POST /api/v1/otlp/v1/traces, API key scope `otlp`). Off by default: set
  # EAP_OTLP_FORWARD_ENDPOINT to http://lgtm:4318/v1/traces to ALSO forward each received request, unchanged
  # (so not redacted), to the collector; the API's egress to lgtm:4318 is already allowed. The rate limit is
  # requests per minute per key and per API replica (0 = no limit).
  EAP_OTLP_FORWARD_ENDPOINT: ""
  EAP_OTLP_RATE_LIMIT_PER_MINUTE: "600"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-setup-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=app_password="$EAP_APP_DATABASE_PASSWORD" \
      --set=dbos_password="$EAP_DBOS_DATABASE_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE eap_app WITH LOGIN PASSWORD %L', :'app_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'eap_app') \gexec
    SELECT format('CREATE ROLE eap_dbos WITH LOGIN PASSWORD %L', :'dbos_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'eap_dbos') \gexec
    SELECT 'CREATE DATABASE eap_app OWNER eap_app'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'eap_app') \gexec
    SELECT 'CREATE DATABASE eap_dbos OWNER eap_dbos'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'eap_dbos') \gexec
    REVOKE CONNECT ON DATABASE eap_app FROM PUBLIC;
    REVOKE CONNECT ON DATABASE eap_dbos FROM PUBLIC;
    GRANT CONNECT ON DATABASE eap_app TO eap_app;
    GRANT CONNECT ON DATABASE eap_dbos TO eap_dbos;
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname eap_app \
      -c 'CREATE EXTENSION IF NOT EXISTS vector;'
