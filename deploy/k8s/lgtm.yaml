apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - {name: grafana, port: 3000, targetPort: grafana}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: loki, port: 3100, targetPort: loki}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lgtm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lgtm}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lgtm
          image: grafana/otel-lgtm@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: loki, containerPort: 3100}
          resources:
            requests: {cpu: "250m", memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: grafana}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: grafana}
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: tempo-runtime, mountPath: /var/tempo}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 10Gi}
        - name: tmp
          emptyDir: {}
        - name: tempo-runtime
          emptyDir: {}
