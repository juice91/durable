# Public access: an in-cluster Cloudflare Tunnel connector (deploy/README.md, "Public access via Cloudflare Tunnel").
# The tunnel publishes your public hostname (<public-host>) behind Cloudflare Access: path ^/api/ goes to
# http://api.pydanticos.svc.cluster.local:8000, everything else to http://studio.pydanticos.svc.cluster.local:3000.
#
# Off by default (replicas: 0), like studio. up.sh scales it to 1 only when the deploy secret carries a non-empty
# CLOUDFLARE_TUNNEL_TOKEN, and back to 0 when it does not, so a deploy without the token still succeeds and an
# empty token field is how the public hostname is switched off. `optional: true` only keeps the pod spec valid
# when the key is absent from the Secret (for example a local --secrets-env file without it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared}
      # up.sh replaces the placeholder with a hash of the Secret values this pod reads, so a rotated value restarts it
      # at the next deploy, under the drain (deploy/README.md, "Rotation"). Placeholder text is harmless without up.sh.
      annotations: {pydanticos.dev/secrets-checksum: "@@CHECKSUM_CLOUDFLARED@@"}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          # Pinned by version and digest (multi-arch index). Bump both together.
          image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: cloudflared-secrets, key: CLOUDFLARE_TUNNEL_TOKEN, optional: true}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: metrics, containerPort: 2000}
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {cpu: "500m", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
