# Template only; deliberately excluded from kustomization.yaml. up.sh creates this Secret from the secrets file
# (deploy/k8s/secrets.example.env lists the keys).
apiVersion: v1
kind: Secret
metadata:
  name: pydanticos-secrets
  namespace: pydanticos
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  EAP_APP_DATABASE_PASSWORD: ""
  EAP_DBOS_DATABASE_PASSWORD: ""
  EAP_DATABASE_URL: ""
  EAP_DBOS_URL: ""
  EAP_SECRETS_KEY: ""
  EAP_LITELLM_API_KEY: ""
  EAP_LITELLM_EMBEDDING_API_KEY: ""
  EAP_AUDIT_HASH_SALT: ""
  EAP_BLOB_S3_ACCESS_KEY: ""
  EAP_BLOB_S3_SECRET_KEY: ""
  # Optional keys, present only when the secrets file has them (ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN, and the
  # ZITADEL sign-in values EAP_ZITADEL_PROJECT_ID, EAP_ZITADEL_ORG_TENANT_MAP, EAP_ZITADEL_STUDIO_CLIENT_ID,
  # EAP_ZITADEL_MACHINE_KEY: deploy/README.md, "ZITADEL bootstrap and sign-in").
  # Optional identity services (deploy/k8s/iam): only the two database passwords are also here, for the backup job.
  # The rest goes to namespace iam (zitadel-secrets and openfga-secrets, see iam/secret.template.yaml). The tunnel token is
  # the Secret cloudflared-secrets (key CLOUDFLARE_TUNNEL_TOKEN), also optional.
  ZITADEL_DB_PASSWORD: ""
  OPENFGA_DB_PASSWORD: ""
