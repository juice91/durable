# Template only; deliberately excluded from kustomization.yaml. up.sh creates this Secret from the secrets file
# (deploy/k8s/secrets.example.env lists the keys).
apiVersion: v1
kind: Secret
metadata:
  name: pydanticos-secrets
  namespace: pydanticos
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  EAP_APP_DATABASE_PASSWORD: ""
  EAP_DBOS_DATABASE_PASSWORD: ""
  EAP_DATABASE_URL: ""
  EAP_DBOS_URL: ""
  EAP_SECRETS_KEY: ""
  EAP_LITELLM_API_KEY: ""
  EAP_LITELLM_EMBEDDING_API_KEY: ""
  EAP_AUDIT_HASH_SALT: ""
  EAP_BLOB_S3_ACCESS_KEY: ""
  EAP_BLOB_S3_SECRET_KEY: ""
  # Optional keys, present only when the secrets file has them (ANTHROPIC_API_KEY and the
  # ZITADEL sign-in values EAP_ZITADEL_PROJECT_ID, EAP_ZITADEL_ORG_TENANT_MAP, EAP_ZITADEL_STUDIO_CLIENT_ID,
  # EAP_ZITADEL_MACHINE_KEY).
  # Optional identity services (deploy/k8s/iam): only the two database passwords are also here (for the backup job), and
  # OPENFGA_PRESHARED_KEY, which the API and the worker present to OpenFGA (EAP_OPENFGA_PRESHARED_KEY). The rest goes to namespace iam (zitadel-secrets and openfga-secrets, see iam/secret.template.yaml).
  # The built-in admin account (docs/admin-account.md). up.sh fills the signing key when it is empty. To set your own:
  # generate with: openssl rand -base64 48; never commit it.
  EAP_LOCAL_ADMIN_USERNAME: ""
  EAP_LOCAL_ADMIN_INITIAL_PASSWORD: ""
  EAP_LOCAL_AUTH_SIGNING_KEY: ""
  ZITADEL_DB_PASSWORD: ""
  OPENFGA_DB_PASSWORD: ""
  OPENFGA_PRESHARED_KEY: ""
