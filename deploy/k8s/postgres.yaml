apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.2-pg17-trixie
          imagePullPolicy: IfNotPresent
          # The upstream PostgreSQL entrypoint needs several writable system paths.
          # Keep the root filesystem writable while retaining all other restrictions.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: false
          args:
            - postgres
            - -c
            - max_connections=300
            - -c
            - shared_buffers=512MB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=128MB
            - -c
            - effective_cache_size=2GB
            - -c
            - idle_in_transaction_session_timeout=300000
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: eap_admin
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: POSTGRES_PASSWORD}
            - name: EAP_APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_APP_DATABASE_PASSWORD}
            - name: EAP_DBOS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DBOS_DATABASE_PASSWORD}
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d postgres"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d postgres"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: dshm, mountPath: /dev/shm}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 50Gi}
