apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: worker}
  ports:
    - {name: health, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker}
      # up.sh replaces the placeholder with a hash of the Secret values this pod reads, so a rotated value restarts it
      # at the next deploy, under the drain. Placeholder text is harmless without up.sh.
      annotations: {pydanticos.dev/secrets-checksum: "@@CHECKSUM_PLATFORM@@"}
    spec:
      serviceAccountName: pydanticos-mcp-worker
      hostAliases:
        - ip: 192.168.5.2
          hostnames: [host.lima.internal]
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: pydanticos-python
          imagePullPolicy: Never
          args: [worker]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: pydanticos-config}
          env:
            - name: EAP_EXECUTOR_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: EAP_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DATABASE_URL}
            - name: EAP_DBOS_URL
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_DBOS_URL}
            - name: EAP_SECRETS_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_SECRETS_KEY}
            - name: EAP_LITELLM_API_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_LITELLM_API_KEY}
            - name: EAP_LITELLM_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_LITELLM_EMBEDDING_API_KEY}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: ANTHROPIC_API_KEY, optional: true}
            # OpenFGA's preshared key (optional): the same Secret field OpenFGA itself reads, so the two cannot differ.
            # Used only when EAP_IAM_POLICY is openfga.
            - name: EAP_OPENFGA_PRESHARED_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: OPENFGA_PRESHARED_KEY, optional: true}
            - name: EAP_AUDIT_HASH_SALT
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_AUDIT_HASH_SALT}
            - name: EAP_BLOB_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_ACCESS_KEY}
            - name: EAP_BLOB_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: pydanticos-secrets, key: EAP_BLOB_S3_SECRET_KEY}
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "4", memory: 8Gi}
          readinessProbe:
            exec: {command: [sh, -c, "tr '\\0' ' ' </proc/1/cmdline | grep -q eap_worker"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -c, "tr '\\0' ' ' </proc/1/cmdline | grep -q eap_worker"]}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
