[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-api"
version = "0.1.0"
description = "Control-plane API for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eap-schemas",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "psycopg[binary]>=3",
    "eap-run-store",
    "eap-db",
    "eap-observability",
    "dbos>=3.5.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
eap-run-store = { workspace = true }
eap-db = { workspace = true }
eap-observability = { workspace = true }
