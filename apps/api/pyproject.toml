[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-api"
version = "0.1.0"
description = "Control-plane API for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eap-schemas",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "psycopg[binary]>=3",
    "eap-run-store",
    "eap-db",
    "eap-observability",
    "dbos>=3.5.0",
    "uvicorn>=0.34.0",
    "eap-secrets",
    # Processor catalog test console and RE2 validation of blocklist patterns at publish.
    "eap-processors",
    # Knowledge base uploads are extracted once to reject unsupported or unsafe content early.
    "eap-knowledge",
    # The model price override file and cost arithmetic (shared by the worker and the API).
    "eap-pricing",
    # Workflow run input is checked against the version's input_schema, with an empty
    # referencing.Registry (no remote $ref is ever retrieved).
    "jsonschema>=4.20",
    "referencing>=0.30",
    # Test suite import and export (the pydantic_evals dataset file): yaml.safe_load only.
    "pyyaml==6.0.3",
    # The MCP client Pydantic AI's [mcp] extra uses; the API may not import pydantic_ai itself.
    "fastmcp-slim[client]>=3.3.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.24",
    # A local MCP server for the connection-test tests.
    "fastmcp-slim[server]>=3.3.0,<5",
]

[tool.uv.sources]
eap-run-store = { workspace = true }
eap-db = { workspace = true }
eap-observability = { workspace = true }
eap-secrets = { workspace = true }
eap-processors = { workspace = true }
eap-knowledge = { workspace = true }
eap-pricing = { workspace = true }
