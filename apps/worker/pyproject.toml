[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-worker"
version = "0.1.0"
description = "Worker runtime for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eap-schemas",
    "eap-agent-runtime",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-agent-runtime = { workspace = true }
