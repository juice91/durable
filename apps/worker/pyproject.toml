[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-worker"
version = "0.1.0"
description = "Worker runtime for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-schemas",
    "eap-agent-runtime",
    "eap-run-store",
    "eap-blob-store",
    "eap-db",
    "eap-observability",
    "eap-secrets",
    # Managed MCP servers: the runtime contract the worker starts and stops them through.
    "eap-mcp-runtime",
    # Input and output processors (P0.17): the deterministic chains run in the worker's steps.
    "eap-processors",
    # Knowledge base extraction and chunking (RM.10, eap.kb_ingest).
    "eap-knowledge",
    # Knowledge-base source adapters (eap.kb_source_sync drives them).
    "eap-kb-sources",
    # The model price override file and cost arithmetic (shared by the worker and the API).
    "eap-pricing",
    "pydantic-ai-slim[anthropic,dbos,openai]>=2.67.0",
    "dbos[otel]>=3.5.0",
    # MCP tools in agents (task 3.5): the MCP client Pydantic AI's [mcp] extra builds on.
    "fastmcp-slim[client]>=3.3.0,<5",
    # Checks a model's MCP tool arguments against the tool's JSON schema before any call.
    "jsonschema>=4.20",
    # An empty registry for those schemas: no remote $ref is ever retrieved.
    "referencing>=0.30",
    # The policy-checked HTTP client's response hook caps MCP response bodies.
    "httpx2>=2.16",
    # Default model prices for usage cost (eap_worker.pricing); already pinned via pydantic-ai.
    "genai-prices>=0.2.3",
    # Eval runtime (AC.11): evaluator classes used standalone (EqualsExpected, Contains, MaxDuration,
    # EvaluatorContext); pins pydantic-ai-slim==2.67.0, so both move in lockstep. Only eap_worker
    # imports it (import-linter contract in the root pyproject.toml).
    "pydantic-evals==2.67.0",
    # The `regex` evaluator matches with RE2 (linear time), as the processors do.
    "google-re2==1.1.20251105",
    "defusedxml>=0.7.1",
    "jmespath>=1.1.0",
    "regex>=2026.11.9",
    "selectolax>=0.4",
]

[dependency-groups]
dev = [
    # A local MCP server (FastMCP over Streamable HTTP) for the MCP tool tests.
    "fastmcp-slim[server]>=3.3.0,<5",
    "uvicorn>=0.34.0",
    # AGUI.4 parity tests: the stock AG-UI adapter (pydantic_ai.ui.ag_ui needs ag_ui) against the
    # API's translator (eap_api.ag_ui). Test-only: eap_worker itself never imports either.
    "ag-ui-protocol==1.0.0",
    "eap-api",
]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-agent-runtime = { workspace = true }
eap-run-store = { workspace = true }
eap-blob-store = { workspace = true }
eap-db = { workspace = true }
eap-observability = { workspace = true }
eap-secrets = { workspace = true }
eap-mcp-runtime = { workspace = true }
eap-processors = { workspace = true }
eap-knowledge = { workspace = true }
eap-kb-sources = { workspace = true }
eap-api = { workspace = true }
eap-pricing = { workspace = true }
