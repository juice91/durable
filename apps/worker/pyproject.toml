[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-worker"
version = "0.1.0"
description = "Worker runtime for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eap-schemas",
    "eap-agent-runtime",
    "eap-run-store",
    "eap-db",
    "pydantic-ai-slim[dbos,openai]>=2.67.0",
    "dbos>=3.5.0",
]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-agent-runtime = { workspace = true }
eap-run-store = { workspace = true }
eap-db = { workspace = true }
