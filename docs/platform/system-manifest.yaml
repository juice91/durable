# The versioned system manifest: what the platform is, for the Architect (and for people).
#
# Two kinds of section:
#   - hand-written (everything above `generated:`): roles and rules in prose. Bump manifest_version when their
#     meaning changes. They never repeat a generated number or id: write {{limits.workflow.max_steps}} or list the
#     capability under a pattern's `needs`.
#   - generated (between the markers): produced from code constants and the capability registry. Never edit by
#     hand: run `uv run python scripts/ci/system_manifest.py --write`. CI runs `--check` and fails on any drift.
# Design: an internal design note (section 3).
manifest_version: 2
platform:
  name: pydanticos
  purpose: >-
    A durable platform for building and running AI agents and workflows. A person describes what they want, the
    platform stores it as a versioned definition, and a worker runs it as a durable, replayable workflow whose
    steps, tool calls and approvals are recorded.
components:
  - id: api
    role: Control plane. Validates and stores definitions, authorises callers, and hands runs to the worker.
  - id: worker
    role: Runs agents and workflows as durable workflows; a run survives a restart and replays from its recorded steps.
  - id: studio
    role: Web interface for people. It talks only to the API.
  - id: run-store
    role: All SQL. Every query is scoped to one tenant.
  - id: knowledge
    role: Knowledge bases, their connected sources, syncs and retrieval.
  - id: mcp-runtime
    role: Runs and connects MCP servers whose tools an agent may be granted.
  - id: eval
    role: Test suites, cases and scorers that check an agent or workflow against a published version.
  - id: scheduler
    role: Starts a published workflow on a cron schedule in a timezone.
  - id: postgres
    role: The database. Holds the run store and the worker's durable state.
relationships:
  - {source: studio, target: api, via: "HTTP, and a live event stream for runs"}
  - {source: api, target: worker, via: "a durable queue; the API never runs an agent itself"}
  - {source: worker, target: postgres, via: "durable workflow state and the run store"}
  - {source: api, target: run-store, via: "every read and write of a definition, a run or an approval"}
  - {source: scheduler, target: worker, via: "each fire starts a run of the latest published version"}
  - {source: worker, target: knowledge, via: "retrieval for agents and the ingest of source syncs"}
  - {source: worker, target: mcp-runtime, via: "tool calls to MCP servers"}
  - {source: eval, target: worker, via: "each case is a run of a published version"}
lifecycle:
  agent: [draft, publish, version, archive]
  workflow: [draft, publish, version, archive, schedule]
  rules:
    - A draft changes nothing that is running; publishing creates an immutable version.
    - Publishing, restoring a version, archiving and schedule changes go live, so a person approves each of them.
    - A schedule starts the latest published version of its workflow at each fire.
    - A long wait for a person belongs in an approval step, not in a loop.
    - A run that is interrupted resumes from its recorded steps; it does not start again.
    - Step ids follow one convention so workflows read the same everywhere. A branch step is named <subject>_gate (check_gate, login_gate, richtext_gate).
    - A step that ends the run with a result is named ret_<reason> (ret_posted, ret_dry, ret_check_failed).
    - Every other step is a snake_case noun or verb that says what it does (fetch_rss, pick, write, check, post_thumb). No step id is longer than 40 characters; publishing warns about each id that breaks the convention and suggests the name.
patterns:
  - id: pattern.scheduled_report
    summary: Collect on a schedule, let an agent write the result, post it with a web call.
    needs: [trigger.schedule, step.tool, step.agent, tool.http.request]
  - id: pattern.rag_agent
    summary: An agent that answers from the tenant's knowledge bases.
    needs: [feature.kb.retrieve]
  - id: pattern.feed_digest
    summary: Read feeds, filter and shape the items, let an agent summarise, check the text before posting.
    needs: [tool.http.request, tool.feed.parse, tool.text.check, step.branch]
  - id: pattern.approval_gate
    summary: A person approves a step before the workflow continues.
    needs: [step.approval, feature.approvals]
  - id: pattern.eval_suite
    summary: Test a published agent or workflow with cases and scorers.
    needs: [feature.evals]
