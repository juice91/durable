[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-blob-store"
version = "0.1.0"
description = "Object storage for attachment bytes: a filesystem backend (dev, tests) and an S3-compatible one (Cloudflare R2)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore==3.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eap_blob_store"]
