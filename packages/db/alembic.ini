# Alembic config for the eap_app database. Run from the repo root:
#   EAP_DATABASE_URL=postgresql+psycopg://... uv run alembic -c packages/db/alembic.ini upgrade head
# The database URL is read from EAP_DATABASE_URL by env.py; it is deliberately not stored here.

[alembic]
script_location = %(here)s/src/eap_db/migrations
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
