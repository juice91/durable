[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-agent-runtime"
version = "0.5.0"
description = "Agent runtime for PydanticOS"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-schemas",
    "pydantic-ai-slim>=2.67.0",
]

[tool.uv.sources]
eap-schemas = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eap_runtime"]
