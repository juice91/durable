[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-kb-sources"
version = "0.5.0"
description = "Knowledge-base source adapters: the provider-neutral adapter protocol, budgets and a fake adapter"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-schemas",
    "eap-run-store",
    "eap-secrets",
]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-run-store = { workspace = true }
eap-secrets = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eap_kb_sources"]
