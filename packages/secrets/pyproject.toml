[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-secrets"
version = "0.1.0"
description = "Platform secret encryption and the outbound connection policy for EAP"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "cryptography>=44",
    "httpx2>=2.16",
    "httpcore2>=2.16",
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eap_secrets"]
