[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-run-store"
version = "0.1.0"
description = "Run persistence package for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-schemas",
    "eap-pricing",
    "eap-processors",
    "eap-secrets",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3",
    "pgvector>=0.4",
]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-pricing = { workspace = true }
eap-processors = { workspace = true }
eap-secrets = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/eap_run_store"]
