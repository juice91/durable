[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eap-schemas"
version = "0.5.0"
description = "Shared Pydantic schemas for the Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2",
    # Client tool schemas (eap_schemas.client_tools): Draft 2020-12 meta-schema check.
    "jsonschema>=4.20",
    # The system manifest (eap_schemas.system_manifest) is a YAML file.
    "pyyaml>=6",
]
