name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists the PR's files through the API; the workflow default stays contents: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      studio: ${{ steps.filter.outputs.studio }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # paths-filter diffs against the push's `before` commit. Without credentials it cannot
          # fetch that commit later, so the full history must be in the checkout (cheap for this repo).
          fetch-depth: 0
      - name: Select affected gates
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'packages/**'
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'config/**'
            studio:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'apps/studio/**'
              - '.github/workflows/ci.yml'
            deploy:
              - '.github/**'
              - 'deploy/**'
              - 'tests/deploy/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compatibility tests read older commits (e.g. pre-AC main) with git ls-tree/show.
          fetch-depth: 0
      - name: Ensure local main ref for compatibility tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # checkout ran with persist-credentials: false, so pass the token for this one fetch.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --abbrev-ref HEAD 2>/dev/null)" != "main" ]; then
            git update-ref refs/heads/main refs/remotes/origin/main
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - run: uv run lint-imports
      - name: DB-free unit tests
        run: >-
          uv run pytest -p no:eap_db -q
          packages/shared-schemas/tests
          packages/agent-runtime/runtime_tests
          packages/kb-sources/kb_sources_tests
          packages/knowledge/knowledge_tests
          packages/observability/tests
          packages/pricing/pricing_tests
          packages/processors/processors_tests
          packages/secrets/secrets_tests

  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/studio lint
      - run: pnpm -C apps/studio exec tsc --noEmit

  studio-test:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', '5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the Vite and Vitest transform cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/studio/node_modules/.vite
          # Transforms depend on the dependency set and the Vite/Vitest config. A shard keeps its own
          # entry (same files every run), and a stale entry from an older lockfile is still a head start.
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/studio/vite.config.ts') }}-${{ matrix.shard }}
          restore-keys: |
            vite-${{ runner.os }}-
      - run: pnpm -C apps/studio exec vitest run --shard=${{ matrix.shard }}/5

  deploy-checks:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.7.0
      ACTIONLINT_VERSION: v1.7.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: Install manifest and workflow linters
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@"${KUBECONFORM_VERSION}"
          go install github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"
          # go install writes to $(go env GOPATH)/bin, which is not on the runner's PATH.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate rendered manifests
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary
      - name: Shellcheck deployment scripts
        run: shellcheck deploy/scripts/*.sh deploy/runner/*.sh
      - name: Validate Actions workflows
        run: actionlint
      - name: Deployment tests without image builds
        env:
          PYTEST_ADDOPTS: --ignore=tests/deploy/test_images.py
        run: uv run pytest tests/deploy -q
