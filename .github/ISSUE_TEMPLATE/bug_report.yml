name: Bug Report
description: File a bug report
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug you're experiencing.
      placeholder: e.g., "API returns 500 when submitting an empty payload"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Call POST /api/v1/endpoint with payload `{}`
        2. Observe the response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: "e.g., Return 400 with a validation error message"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
      placeholder: "e.g., Returned 500 with an internal server error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: The commit hash or version where this occurred.
      placeholder: e.g., `a1b2c3d`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs or error messages.
      render: shell
    validations:
      required: false
