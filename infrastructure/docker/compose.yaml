services:
  postgres:
    # The official Postgres 17 image plus the pgvector extension (0.8 or later for iterative index
    # scans). Same major version as the former postgres:17 image, so an existing postgres_data volume
    # opens unchanged; see "pgvector" in packages/db/README.md for the in-place upgrade. Keep the
    # -trixie suffix: postgres:17 is Debian 13 (glibc 2.41), and the plain -pg17 tag is Debian 12
    # (glibc 2.36), whose different collation version would invalidate text indexes on the volume.
    image: pgvector/pgvector:0.8.2-pg17-trixie
    container_name: eap_postgres
    # Dev tuning (2026-11-15): the default 100 max_connections + 64 MB shared_buffers / shm crashed
    # three times under the AC + RAG P1 + AG-UI test chains on a shared Postgres. Bump both and
    # bump shm_size to match (PG uses shared memory heavily for parallel query workers and the
    # buffer pool).
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "idle_in_transaction_session_timeout=300000"
    shm_size: "1gb"
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eap_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eap_admin_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  lgtm:
    image: grafana/otel-lgtm@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    container_name: eap_lgtm
    ports:
      - "127.0.0.1:3002:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # Loki's HTTP API, for the API's log search (EAP_LOKI_URL). Loopback only. Development only:
      # this Loki has no auth (auth_enabled: false) and the OTLP ports above accept unauthenticated
      # writes, so anything on this host could read every tenant's logs or forge records. Production
      # needs Loki multi-tenancy or an authenticated gateway in front of it, and authenticated OTLP.
      - "127.0.0.1:3100:3100"
    volumes:
      - lgtm_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  lgtm_data:
