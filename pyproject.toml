[project]
name = "pydanticos"
version = "0.1.0"
description = "PydanticOS - Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "eap-schemas",
    "eap-mcp-runtime",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "import-linter>=2.0",
    "pytest-xdist>=3.8.0",
    "pip-licenses>=5.5.5",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker"]

[tool.uv.sources]
eap-schemas = { workspace = true }
eap-mcp-runtime = { workspace = true }

[tool.importlinter]
root_packages = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_observability", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing", "eap_mcp_runtime", "eap_kb_sources"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contracts layer (eap_schemas) depends on nothing else"
type = "forbidden"
source_modules = ["eap_schemas"]
forbidden_modules = ["eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_processors", "eap_knowledge", "sqlalchemy", "fastapi", "pydantic_ai", "dbos"]

[[tool.importlinter.contracts]]
name = "Agent runtime has no persistence, web or DBOS"
type = "forbidden"
source_modules = ["eap_runtime"]
forbidden_modules = ["eap_run_store", "eap_api", "eap_worker", "sqlalchemy", "fastapi", "dbos"]

[[tool.importlinter.contracts]]
name = "Run store has no runtime, web, agent or DBOS"
type = "forbidden"
source_modules = ["eap_run_store"]
forbidden_modules = ["eap_runtime", "eap_api", "eap_worker", "fastapi", "pydantic_ai", "dbos"]

[[tool.importlinter.contracts]]
name = "Control plane never imports orchestration or the runtime"
type = "forbidden"
source_modules = ["eap_api"]
forbidden_modules = ["eap_worker", "eap_runtime", "pydantic_ai"]

[[tool.importlinter.contracts]]
name = "Only eap_observability may import OpenTelemetry"
type = "forbidden"
source_modules = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing", "eap_kb_sources"]
forbidden_modules = ["opentelemetry"]
# Direct imports only: the sanctioned path is eap_api/eap_worker -> eap_observability -> opentelemetry.
# Every other root package is a source here, so any indirect chain must still end in a direct
# import by eap_observability; this keeps the rule exactly "only eap_observability imports OTel".
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Secrets and outbound policy have no web, database, agent or platform imports"
type = "forbidden"
source_modules = ["eap_secrets"]
forbidden_modules = [
    "eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability",
    "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai", "fastmcp", "mcp", "dbos",
]

[[tool.importlinter.contracts]]
name = "The MCP runtime adapter has no platform, web, database or agent imports"
type = "forbidden"
source_modules = ["eap_mcp_runtime"]
forbidden_modules = [
    "eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability",
    "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing",
    "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai", "fastmcp", "mcp", "dbos",
]

[[tool.importlinter.contracts]]
name = "Knowledge-base source adapters have no web, worker or DBOS imports"
type = "forbidden"
# eap_kb_sources may import eap_schemas, eap_run_store and eap_secrets; the worker owns the DBOS
# workflow that drives an adapter and the API owns the routes.
source_modules = ["eap_kb_sources"]
forbidden_modules = ["eap_api", "eap_worker", "eap_runtime", "fastapi", "starlette", "dbos", "pydantic_ai"]

[[tool.importlinter.contracts]]
name = "Processors import only the standard library, eap_schemas and re2"
type = "forbidden"
source_modules = ["eap_processors"]
# The API (test console, publish validation) and the worker (runtime) import eap_processors; it
# imports nothing of theirs and no I/O, web, database, agent or telemetry library.
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai", "fastmcp", "mcp", "dbos", "httpx",
    "httpx2", "opentelemetry", "cryptography", "jsonschema", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Knowledge extraction imports only the standard library, eap_schemas and its parsers"
type = "forbidden"
source_modules = ["eap_knowledge"]
# Pure and deterministic: the API (upload validation) and the worker (kb_ingest) import
# eap_knowledge; it imports nothing of theirs and no I/O, web, database, agent or telemetry library.
# Its parsers: markdown_it (API path), and docutils and yaml (RAG P1, the worker extractors in
# eap_knowledge.formats.*, which only the worker's sandbox child imports).
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "eap_processors", "fastapi", "starlette", "sqlalchemy", "psycopg", "pgvector", "pydantic_ai", "fastmcp",
    "mcp", "dbos", "httpx", "httpx2", "opentelemetry", "tiktoken", "bs4", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Only eap_api.ag_ui may import the AG-UI protocol package (ag_ui)"
type = "forbidden"
# D19: ag-ui-protocol is used only inside eap_api.ag_ui; data reaching the run row and the worker
# uses eap_schemas.client_tools. Direct imports only: the rest of eap_api reaches ag_ui through
# eap_api.ag_ui (the sanctioned path), and the other roots may not import eap_api at all.
source_modules = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_observability", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing", "eap_mcp_runtime", "eap_kb_sources"]
forbidden_modules = ["ag_ui"]
ignore_imports = ["eap_api.ag_ui -> ag_ui", "eap_api.ag_ui.** -> ag_ui"]
unmatched_ignore_imports_alerting = "none"  # eap_api.ag_ui arrives with AGUI.4
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The API and the run store never import a document parser"
type = "forbidden"
source_modules = ["eap_api", "eap_run_store"]
# RAG P1: uploaded files are parsed only in the worker's sandbox child. The API may import the
# parser-free format registry (eap_knowledge.formats) and extract() (markdown_it), never the
# worker-side extractor modules, the sandbox entry point or their parsers.
forbidden_modules = [
    "docutils", "pypdf", "pypdfium2", "PIL", "eap_knowledge.formats.rst",
    "eap_knowledge.formats.structured", "eap_knowledge.formats.doxygen", "eap_knowledge.formats.pdf",
    "eap_knowledge.sandbox",
]

[[tool.importlinter.contracts]]
name = "The worker process never imports a document parser (only its sandbox child does)"
type = "forbidden"
source_modules = ["eap_worker"]
# RAG P1 (P1.A3): eap_worker.extract_sandbox starts `python -I -m eap_knowledge.sandbox` as a child
# process; a parser bug or bomb must kill that child, never the worker. Importing a parser here would
# put it in the worker's own process.
forbidden_modules = [
    "docutils", "pypdf", "pypdfium2", "PIL", "eap_knowledge.formats.rst",
    "eap_knowledge.formats.structured", "eap_knowledge.formats.doxygen", "eap_knowledge.formats.pdf",
    "eap_knowledge.sandbox",
]

[[tool.importlinter.contracts]]
name = "Pricing imports only the standard library, eap_schemas, pydantic and genai_prices"
type = "forbidden"
source_modules = ["eap_pricing"]
# Shared by the API (reindex estimate, price_known) and the worker (request costs): no platform
# package and no I/O library. genai-prices (a bundled price snapshot; eap_pricing never calls its
# network updater) is allowed so the API's price_known and the worker's pricing are one lookup.
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "eap_processors", "eap_knowledge", "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai",
    "fastmcp", "mcp", "dbos", "httpx", "opentelemetry", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Only eap_worker imports pydantic_evals"
type = "forbidden"
# AC.11: the eval runtime uses pydantic_evals' evaluator classes standalone. The API validates suites
# with eap_schemas.evals and reads and writes the dataset file format itself, without the library.
source_modules = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_observability", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing"]
forbidden_modules = ["pydantic_evals"]

[[tool.importlinter.contracts]]
name = "eap_worker must not import eap_api"
type = "forbidden"
source_modules = ["eap_worker"]
forbidden_modules = ["eap_api"]

[[tool.importlinter.contracts]]
name = "Observability core has no web framework imports"
type = "forbidden"
# What a service may import (redaction, trace context, log context): web-free, so a service that logs does not
# pull fastapi into the services layer. eap_observability.http (the access log, the instrumentor hook) is the
# web-facing part; the package root imports it, so a service imports these submodules, never the root.
source_modules = [
    "eap_observability.redaction",
    "eap_observability.context",
    "eap_observability.logcontext",
    "eap_observability.pathredact",
]
forbidden_modules = ["fastapi", "starlette", "eap_observability.http"]

[[tool.importlinter.contracts]]
name = "API services have no web framework imports"
type = "forbidden"
# A service receives its collaborators through its constructor and refuses with ServiceError; the
# routes and the providers in eap_api.deps are the only web-facing code (see eap_api/services/__init__.py).
source_modules = ["eap_api.services"]
forbidden_modules = ["fastapi", "starlette", "eap_api.routes", "eap_api.deps"]

[[tool.importlinter.contracts]]
name = "API dependency providers do not import entry points"
type = "forbidden"
source_modules = ["eap_api.deps"]
forbidden_modules = ["eap_api.routes", "eap_api.mcp_control", "eap_api.ag_ui", "eap_api.services"]

[[tool.importlinter.contracts]]
name = "API ports have no web or platform-entry imports"
type = "forbidden"
source_modules = ["eap_api.ports"]
forbidden_modules = ["fastapi", "starlette", "eap_api.routes", "eap_api.mcp_control", "eap_api.ag_ui", "eap_api.deps", "eap_api.service_deps", "eap_api.services"]

[[tool.importlinter.contracts]]
name = "Service providers do not import entry points"
type = "forbidden"
source_modules = ["eap_api.service_deps"]
forbidden_modules = ["eap_api.routes", "eap_api.mcp_control", "eap_api.ag_ui"]

[[tool.importlinter.contracts]]
name = "API entry points do not query the database"
type = "forbidden"
source_modules = ["eap_api.routes", "eap_api.mcp_control", "eap_api.ag_ui"]
forbidden_modules = ["sqlalchemy"]
# Direct imports only: eap_run_store (all SQL) legitimately imports sqlalchemy; an entry point must not.
allow_indirect_imports = true
ignore_imports = [
    # ratchet: remove when this module moves its queries to eap_run_store or a service; never add lines
    "eap_api.mcp_control.auth -> sqlalchemy",
    "eap_api.mcp_control.routing -> sqlalchemy",
    "eap_api.routes -> sqlalchemy",
    "eap_api.routes.ag_ui -> sqlalchemy",
    "eap_api.routes.ag_ui_workflows -> sqlalchemy",
    "eap_api.routes.architect -> sqlalchemy",
    "eap_api.routes.conversations -> sqlalchemy",
    "eap_api.routes.processors -> sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "API entry points reach data only through services"
type = "forbidden"
source_modules = ["eap_api.routes", "eap_api.mcp_control", "eap_api.ag_ui"]
forbidden_modules = ["eap_run_store"]
# Direct imports only: services and eap_api.deps (outside the entry points) may import eap_run_store.
allow_indirect_imports = true
ignore_imports = [
    # ratchet: remove when this module calls a service instead of eap_run_store; never add lines
    # (an import of only a constant or a type, e.g. TERMINAL_RUN_STATUSES, may be re-exported through eap_schemas or the service module later)
    "eap_api.ag_ui.input -> eap_run_store",
    "eap_api.mcp_control.auth -> eap_run_store",
    "eap_api.mcp_control.auth -> eap_run_store.run_tokens",
    "eap_api.mcp_control.auth -> eap_run_store.store",
    "eap_api.mcp_control.helpers -> eap_run_store.store",
    "eap_api.mcp_control.routing -> eap_run_store.definition_errors",
    "eap_api.mcp_control.tools_manage -> eap_run_store.mcp_catalog",
    "eap_api.mcp_control.tools_manage -> eap_run_store.store",
    "eap_api.routes -> eap_run_store.agent_checks",
    "eap_api.routes -> eap_run_store.definitions",
    "eap_api.routes -> eap_run_store.revisions",
    "eap_api.routes.ag_ui -> eap_run_store",
    "eap_api.routes.ag_ui -> eap_run_store.chat_attachments",
    "eap_api.routes.ag_ui_workflows -> eap_run_store",
    "eap_api.routes.architect -> eap_run_store.agent_checks",
    "eap_api.routes.architect -> eap_run_store.definition_errors",
    "eap_api.routes.architect -> eap_run_store.definitions",
    "eap_api.routes.architect -> eap_run_store.store",
    "eap_api.routes.architect -> eap_run_store.workflow_checks",
    "eap_api.routes.conversations -> eap_run_store",
    "eap_api.routes.conversations -> eap_run_store.cursor",
    "eap_api.routes.processors -> eap_run_store.store",
    "eap_api.routes.tools -> eap_run_store",
    "eap_api.routes.tools -> eap_run_store.workflow_checks",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api", "apps/worker", "tests"]
norecursedirs = ["node_modules", ".venv", ".next", "spikes", "firstmate", "conversation-export"]
