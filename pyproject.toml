[project]
name = "pydanticos"
version = "0.1.0"
description = "PydanticOS - Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eap-schemas",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "import-linter>=2.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker"]

[tool.uv.sources]
eap-schemas = { workspace = true }

[tool.importlinter]
root_packages = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_observability", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contracts layer (eap_schemas) depends on nothing else"
type = "forbidden"
source_modules = ["eap_schemas"]
forbidden_modules = ["eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_processors", "eap_knowledge", "sqlalchemy", "fastapi", "pydantic_ai", "dbos"]

[[tool.importlinter.contracts]]
name = "Agent runtime has no persistence, web or DBOS"
type = "forbidden"
source_modules = ["eap_runtime"]
forbidden_modules = ["eap_run_store", "eap_api", "eap_worker", "sqlalchemy", "fastapi", "dbos"]

[[tool.importlinter.contracts]]
name = "Run store has no runtime, web, agent or DBOS"
type = "forbidden"
source_modules = ["eap_run_store"]
forbidden_modules = ["eap_runtime", "eap_api", "eap_worker", "fastapi", "pydantic_ai", "dbos"]

[[tool.importlinter.contracts]]
name = "Control plane never imports orchestration or the runtime"
type = "forbidden"
source_modules = ["eap_api"]
forbidden_modules = ["eap_worker", "eap_runtime", "pydantic_ai"]

[[tool.importlinter.contracts]]
name = "Only eap_observability may import OpenTelemetry"
type = "forbidden"
source_modules = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing"]
forbidden_modules = ["opentelemetry"]
# Direct imports only: the sanctioned path is eap_api/eap_worker -> eap_observability -> opentelemetry.
# Every other root package is a source here, so any indirect chain must still end in a direct
# import by eap_observability; this keeps the rule exactly "only eap_observability imports OTel".
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Secrets and outbound policy have no web, database, agent or platform imports"
type = "forbidden"
source_modules = ["eap_secrets"]
forbidden_modules = [
    "eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability",
    "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai", "fastmcp", "mcp", "dbos",
]

[[tool.importlinter.contracts]]
name = "Processors import only the standard library, eap_schemas and re2"
type = "forbidden"
source_modules = ["eap_processors"]
# The API (test console, publish validation) and the worker (runtime) import eap_processors; it
# imports nothing of theirs and no I/O, web, database, agent or telemetry library.
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai", "fastmcp", "mcp", "dbos", "httpx",
    "httpx2", "opentelemetry", "cryptography", "jsonschema", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Knowledge chunking imports only the standard library, eap_schemas and markdown_it"
type = "forbidden"
source_modules = ["eap_knowledge"]
# Pure and deterministic: the API (upload validation) and the worker (kb_ingest) import
# eap_knowledge; it imports nothing of theirs and no I/O, web, database, agent or telemetry library.
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "eap_processors", "fastapi", "starlette", "sqlalchemy", "psycopg", "pgvector", "pydantic_ai", "fastmcp",
    "mcp", "dbos", "httpx", "httpx2", "opentelemetry", "tiktoken", "bs4", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "Only eap_api.ag_ui may import the AG-UI protocol package (ag_ui)"
type = "forbidden"
# D19: ag-ui-protocol is used only inside eap_api.ag_ui; data reaching the run row and the worker
# uses eap_schemas.client_tools. Direct imports only: the rest of eap_api reaches ag_ui through
# eap_api.ag_ui (the sanctioned path), and the other roots may not import eap_api at all.
source_modules = ["eap_schemas", "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_observability", "eap_db", "eap_secrets", "eap_processors", "eap_knowledge", "eap_pricing"]
forbidden_modules = ["ag_ui"]
ignore_imports = ["eap_api.ag_ui -> ag_ui", "eap_api.ag_ui.** -> ag_ui"]
unmatched_ignore_imports_alerting = "none"  # eap_api.ag_ui arrives with AGUI.4
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Pricing imports only the standard library, eap_schemas, pydantic and genai_prices"
type = "forbidden"
source_modules = ["eap_pricing"]
# Shared by the API (reindex estimate, price_known) and the worker (request costs): no platform
# package and no I/O library. genai-prices (a bundled price snapshot; eap_pricing never calls its
# network updater) is allowed so the API's price_known and the worker's pricing are one lookup.
forbidden_modules = [
    "eap_runtime", "eap_run_store", "eap_api", "eap_worker", "eap_db", "eap_observability", "eap_secrets",
    "eap_processors", "eap_knowledge", "fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic_ai",
    "fastmcp", "mcp", "dbos", "httpx", "opentelemetry", "anthropic", "openai",
]

[[tool.importlinter.contracts]]
name = "eap_worker must not import eap_api"
type = "forbidden"
source_modules = ["eap_worker"]
forbidden_modules = ["eap_api"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api", "apps/worker", "tests"]
norecursedirs = ["node_modules", ".venv", ".next", "spikes", "firstmate", "conversation-export"]
